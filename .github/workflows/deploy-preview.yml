name: Publicar Monitor CMPC · Vista previa azul petróleo

on:
  push:
    branches: [preview/azul-petroleo-inter]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpc-monitor-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar JavaScript del panel
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.S)
          combined = chr(10).join(s for s in scripts if s.strip())
          Path('/tmp/cmpc-dashboard.js').write_text(combined, encoding='utf-8')
          PY
          node --check /tmp/cmpc-dashboard.js

      - name: Comprobar datos originales
        run: |
          test -s index.html
          test -s events.json
          test -s predios.geojson
          test -s firms_chile.geojson
          test -s selector_fundos_codes.b64
          test -s .assetsignore

      - name: Publicar solo en Worker de prueba
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config wrangler.preview.jsonc
