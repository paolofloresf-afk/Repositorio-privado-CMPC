name: Publicar Monitor CMPC en Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmpc-monitor-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar JavaScript del dashboard
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', html, re.S)
          Path('/tmp/cmpc-dashboard.js').write_text('\\n'.join(s for s in scripts if s.strip()), encoding='utf-8')
          PY
          node --check /tmp/cmpc-dashboard.js

      - name: Preparar archivos públicos
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html events.json predios.geojson dist/
          test -s dist/index.html
          test -s dist/events.json
          test -s dist/predios.geojson

      - name: Comprobar credenciales de Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN en GitHub Actions."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_ACCOUNT_ID en GitHub Actions."
            exit 1
          fi

      - name: Desplegar Worker y assets estáticos
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
