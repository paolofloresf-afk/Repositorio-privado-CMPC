name: Actualizar y publicar Monitor CMPC

on:
  # Primera validación manual. Activaremos la programación tras validar SIDCO y Cloudflare.
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: cmpc-monitor-production
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias geoespaciales
        run: pip install -r requirements.txt

      - name: Consultar SIDCO y cruzar avisos con predios CMPC
        env:
          SIDCO_URL: ${{ secrets.SIDCO_URL }}
        run: python refresh.py

      - name: Guardar nueva extracción válida
        run: |
          git config user.name "cmpc-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar avisos SIDCO y cruce CMPC"
            git push
          else
            echo "Los datos SIDCO no cambiaron; se mantiene la versión anterior."
          fi

      - name: Preparar carpeta pública
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html events.json dist/

      - name: Publicar dashboard en Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=monitor-cmpc-cloud --branch=main

      - name: Avisar si falta configurar Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "SIDCO fue procesado; la publicación queda pendiente de configurar los secretos de Cloudflare."
