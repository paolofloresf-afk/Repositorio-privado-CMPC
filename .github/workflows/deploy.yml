name: Actualizar y publicar Monitor CMPC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: cmpc-monitor-production
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validar JavaScript del dashboard
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)
          Path('/tmp/cmpc-dashboard.js').write_text('\n'.join(s for s in scripts if s.strip()), encoding='utf-8')
          PY
          node --check /tmp/cmpc-dashboard.js

      - name: Preparar carpeta pública
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html events.json predios.geojson dist/

      - name: Publicar dashboard en Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=monitor-cmpc-cloud --branch=main

      - name: Avisar si falta configurar Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Los datos KMZ ya están integrados en el repositorio; la publicación queda pendiente de configurar los secretos de Cloudflare."
